[project]
name = "picoh-ai"
version = "0.1.0"
description = "AI superpowers for the Ohbot Picoh desktop robot: an MCP server, a realtime voice companion, a face mirror, an autonomous desk pet, an AI theatre, and a kid-friendly show."
# picoh-python pulls playsound==1.2.2 which fails to build on 3.13+
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chris Meah" }]
keywords = ["picoh", "ohbot", "robot", "mcp", "claude", "llm", "ai", "tts", "robotics", "voice"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage      = "https://github.com/chrismeah/picoh-ai"
Repository    = "https://github.com/chrismeah/picoh-ai"
Issues        = "https://github.com/chrismeah/picoh-ai/issues"
"Ohbot Picoh" = "https://www.ohbot.co.uk/picoh.html"

dependencies = [
  # core config / env (no native deps, works on any Python)
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# The actual Picoh hardware driver. Pulls in a transitive ``playsound``
# that doesn't build on Python 3.14 — keep it opt-in so tests can run on
# any interpreter against MockPicoh.
hardware = [
  "picoh>=1.0.0",
]

# Realtime voice (Empath, Theatre performer)
voice = [
  "websockets>=12.0",
  "sounddevice>=0.4.7",
  "numpy>=1.26",
]

# Vision (Empath emotion sensor, Mirror, Companion perception)
vision = [
  "opencv-python>=4.9",
  "mediapipe>=0.10.14",
  # deepface is heavy (TF) - optional; embodiment falls back to MP-only valence
  "deepface>=0.0.93",
]

# MCP server
mcp = [
  "mcp[cli]>=1.2.0",
]

# LLM director / cognition for Theatre & Companion
llm = [
  "anthropic>=0.40.0",
  "openai>=1.55.0",
]

# Everything
all = [
  "picoh-ai[hardware,voice,vision,mcp,llm]",
]

# Test extras
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
picoh-empath    = "picoh_ai.apps.empath:main"
picoh-mcp       = "picoh_ai.apps.picoh_mcp:main"
picoh-mirror    = "picoh_ai.apps.mirror:main"
picoh-theatre   = "picoh_ai.apps.theatre:main"
picoh-companion = "picoh_ai.apps.companion:main"
picoh-show      = "picoh_ai.apps.show:main"
picoh-smoke     = "picoh_ai.apps.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picoh_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
